<div id="splash-intro" aria-hidden="true">
  <canvas id="splash-stars"></canvas>
  <img id="splash-nyan" src="/assets/images/nyancat.gif" alt="nyan cat" />
  <p class="splash-hint">[ press any key or click to skip ]</p>
</div>

<style>
#splash-intro {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
  overflow: hidden;
  transition: opacity 0.5s ease;
}
#splash-intro.splash-exit {
  opacity: 0;
  pointer-events: none;
}

/* hide oneko behind splash until dismissed */
#oneko { visibility: hidden; }

/* stars canvas sits behind everything */
#splash-stars {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#splash-nyan {
  position: relative;
  width: min(480px, 75vw);
  image-rendering: pixelated;
  animation: nyan-enter 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  z-index: 1;
}
@keyframes nyan-enter {
  from { transform: scale(0.5); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}

.splash-hint {
  position: relative;
  z-index: 1;
  font-family: 'DM Sans', sans-serif;
  font-size: clamp(0.65rem, 1.2vw, 0.75rem);
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.3);
  margin: 0;
  animation: fadeUp 0.5s ease 0.5s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>

<script>
(function () {
  if (sessionStorage.getItem('splashShown')) {
    document.getElementById('splash-intro').style.display = 'none';
    /* oneko visible immediately when splash is skipped */
    window.addEventListener('DOMContentLoaded', function () {
      var oneko = document.getElementById('oneko');
      if (oneko) oneko.style.visibility = '';
    });
    return;
  }
  sessionStorage.setItem('splashShown', '1');

  /* ── pixel stars animation ── */
  var canvas = document.getElementById('splash-stars');
  var ctx    = canvas.getContext('2d');
  var W, H, stars = [], rafId;
  var PIXEL = 4;   /* pixel dot size */
  var COUNT = 80;  /* number of stars */

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* spawn stars spread across the screen */
  for (var i = 0; i < COUNT; i++) {
    stars.push({
      x:     Math.random() * W,
      y:     Math.random() * H,
      speed: 2 + Math.random() * 4,   /* px per frame */
      alpha: 0.4 + Math.random() * 0.6
    });
  }

  function drawFrame() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle   = '#ffffff';
      /* pixel-art square dot */
      ctx.fillRect(Math.round(s.x), Math.round(s.y), PIXEL, PIXEL);
      /* move right-to-left */
      s.x -= s.speed;
      /* wrap around to right edge when off-screen left */
      if (s.x < -PIXEL) {
        s.x     = W + PIXEL;
        s.y     = Math.random() * H;
        s.speed = 2 + Math.random() * 4;
        s.alpha = 0.4 + Math.random() * 0.6;
      }
    }
    ctx.globalAlpha = 1;
    rafId = requestAnimationFrame(drawFrame);
  }
  drawFrame();

  /* ── dismiss ── */
  var splash = document.getElementById('splash-intro');
  var done   = false;

  function dismiss() {
    if (done) return;
    done = true;
    cancelAnimationFrame(rafId);
    splash.classList.add('splash-exit');
    setTimeout(function () {
      splash.style.display = 'none';
      /* reveal oneko after splash is gone */
      var oneko = document.getElementById('oneko');
      if (oneko) oneko.style.visibility = '';
    }, 520);
  }

  setTimeout(dismiss, 4000);
  document.addEventListener('keydown', dismiss, { once: true });
  splash.addEventListener('click',    dismiss, { once: true });
})();
</script>
